spring.application.name=api-gateway

server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

#spring.cloud.gateway.server.webflux.default-filters[0]=AddResponseHeader=X-System-Name, Api-Gateway-System
spring.cloud.gateway.server.webflux.routes[0].id=customer-service-route
spring.cloud.gateway.server.webflux.routes[0].uri=lb://customer-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/customers/**

spring.cloud.gateway.server.webflux.routes[1].id=order-service-route
spring.cloud.gateway.server.webflux.routes[1].uri=lb://order-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/v1/order-api/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=RewritePath=/v1/order-api/?(?<segment>.*), /api/v1/orders/$\{segment}
